    <!-- Structured Data (JSON-LD): SoftwareApplication, Organization, FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://dayarplus.co.il/#software",
            "name": "DayarPlus",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, iOS, Android",

              "@type": "AggregateOffer",
              "priceCurrency": "ILS",
              "lowPrice": "199",
              "highPrice": "590",
              "offerCount": "3"
            },
            "aggregateRating": {
              "@type": "AggregateRating",
              "ratingValue": "4.9",
              "reviewCount": "128"
            },
            "description": "הפלטפורמה המובילה לניהול ועד בית, סליקת תשלומים באשראי, מעקב פיננסי, תקלות ותקשורת דיירים."
          },
          {
            "@type": "Organization",
            "@id": "https://dayarplus.co.il/#organization",
            "name": "DayarPlus Management Systems Ltd",
            "url": "https://dayarplus.co.il/",
            "logo": "https://dayarplus.co.il/vite.svg",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+972-77-9988770",
              "contactType": "customer service",
              "availableLanguage": ["Hebrew", "English"]
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://dayarplus.co.il/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "כמה זמן לוקח להקים ולצרף את הבניין למערכת?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "הקמת הבניין אורכת פחות מ-10 דקות! אתם מעלים רשימת דיירים (אפילו מקובץ אקסל), והמערכת שולחת הודעת הצטרפות אוטומטית לכל הדיירים עם קישור ישיר."
                }
              },
              {
                "@type": "Question",
                "name": "האם התשלומים באשראי בטוחים ואיפה הכסף נשמר?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "התשלומים מבוצעים בתקן האבטחה המחמיר ביותר PCI-DSS Level 1. הכסף נגבה ומועבר ישירות לחשבון הבנק הרשמי של ועד הבית / חברת הניהול ללא גורם שלישי."
                }
              },
              {
                "@type": "Question",
                "name": "מה קורה אם חלק מהדיירים קשישים או לא טכנולוגיים?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "המערכת תומכת גם בהזנת תשלומים ידנית (שיקים, מזומן, העברות בנקאיות). הועד יכול להפיק להם קבלה דיגיטלית בלחיצת כפתור ולשמור על רישום מלא."
                }
              },
              {
                "@type": "Question",
                "name": "האם יש התחייבות לתקופה ארוכה?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "ממש לא! ניתן לבטל את המנוי בכל עת ללא קנסות או התחייבות. אנחנו מאמינים שהאיכות והשירות שלנו יגרמו לכם להישאר."
                }
              },
              {
                "@type": "Question",
                "name": "האם ניתן לייצא דוחות לרואה חשבון או לעורך דין?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "כן, המערכת כוללת מחולל דוחות מתקדם המאפשר לייצא דוחות חובות, מאזן הכנסות והוצאות ויומן קבלות בפורמט Excel או PDF."
                }
              }
            ]
          }
        ]
